<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>خانه‌بازار بهاران | املاک حیرانی</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f7fa;
  color:#222;
}

.wrap{
  max-width:480px;
  margin:auto;
  padding:24px 18px;
}

.card{
  background:white;
  border-radius:24px;
  padding:28px 20px;
  box-shadow:0 8px 30px #00000012;
}

.logo{
  text-align:center;
  font-size:42px;
}

h1{
  text-align:center;
  margin:8px 0 4px;
  font-size:27px;
}

.brand{
  text-align:center;
  font-weight:bold;
  font-size:18px;
  margin-bottom:12px;
}

.intro{
  text-align:center;
  color:#666;
  line-height:1.9;
  margin-bottom:24px;
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:22px;
}

.choice{
  border:2px solid #ddd;
  border-radius:16px;
  padding:18px 8px;
  text-align:center;
  background:#fff;
  font-size:17px;
  cursor:pointer;
}

.choice.active{
  border-color:#222;
  background:#f0f2f4;
}

label{
  display:block;
  margin:12px 4px 7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:13px;
  font-size:16px;
}

button.submit{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#222;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button.submit:disabled{
  opacity:.6;
}

.success{
  display:none;
  text-align:center;
  background:#eef8f0;
  border-radius:14px;
  padding:15px;
  margin-top:16px;
  color:#176b2b;
  line-height:1.8;
}

.error{
  display:none;
  text-align:center;
  background:#fff0f0;
  border-radius:14px;
  padding:15px;
  margin-top:16px;
  color:#a00000;
  line-height:1.8;
}

.note{
  text-align:center;
  color:#999;
  font-size:12px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="logo">🏠</div>

<h1>خانه‌بازار بهاران</h1>

<div class="brand">املاک حیرانی</div>

<div class="intro">
ملکتان را برای فروش یا رهن و اجاره به ما بسپارید.
</div>

<div class="choices">

<div class="choice active"
onclick="selectType('فروش ملک',this)">
🏠<br>
فروش ملک
</div>

<div class="choice"
onclick="selectType('رهن و اجاره',this)">
🔑<br>
رهن و اجاره
</div>

</div>

<form onsubmit="submitForm(event)">

<label>نام (اختیاری)</label>

<input
id="name"
type="text"
placeholder="نام شما"
autocomplete="name"
>

<label>شماره موبایل</label>

<input
id="phone"
type="tel"
inputmode="numeric"
placeholder="09xxxxxxxxx"
autocomplete="tel"
required
>

<button
id="submitButton"
class="submit"
type="submit">
ثبت مشخصات
</button>

</form>

<div id="success" class="success">
درخواست شما با موفقیت ثبت شد.
<br>
به‌زودی با شما تماس می‌گیریم.
</div>

<div id="error" class="error">
ثبت درخواست انجام نشد.
<br>
لطفاً دوباره تلاش کنید.
</div>

<div class="note">
املاک حیرانی | بهاران مشهد
</div>

</div>
</div>

<script>

let type = "فروش ملک";

const GOOGLE_SHEET_URL =
"https://script.google.com/macros/s/AKfycbx6XMvIwE3MpwDGQwPBDUoeM7TOa0RCw04fJ0Pu4EGZb98Wn8l4ThcLPB3EQCUoGAF0Cg/exec";


function selectType(t,el){

  type = t;

  document
  .querySelectorAll(".choice")
  .forEach(function(x){
    x.classList.remove("active");
  });

  el.classList.add("active");
}


async function submitForm(e){

  e.preventDefault();

  const name =
  document.getElementById("name").value.trim();

  const phone =
  document.getElementById("phone").value.trim();

  const button =
  document.getElementById("submitButton");

  const success =
  document.getElementById("success");

  const error =
  document.getElementById("error");


  if(!phone){

    alert("لطفاً شماره موبایل خود را وارد کنید.");

    return;
  }


  success.style.display = "none";
  error.style.display = "none";

  button.disabled = true;
  button.innerText = "در حال ثبت...";


  const data = {

    requestType: type,

    name: name,

    mobile: phone

  };


  try{

    await fetch(GOOGLE_SHEET_URL, {

      method: "POST",

      headers: {
        "Content-Type":
        "text/plain;charset=utf-8"
      },

      body: JSON.stringify(data)

    });


    success.style.display = "block";

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";

  }

  catch(err){

    console.error(err);

    error.style.display = "block";

  }


  button.disabled = false;

  button.innerText = "ثبت مشخصات";

}

</script>

</body>
</html>
