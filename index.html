<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>خانه‌بازار بهاران | املاک حیرانی</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;color:#222}.wrap{max-width:480px;margin:auto;padding:24px 18px}.card{background:white;border-radius:24px;padding:28px 20px;box-shadow:0 8px 30px #00000012}.logo{text-align:center;font-size:42px}h1{text-align:center;margin:8px 0 4px;font-size:27px}.brand{text-align:center;font-weight:bold;font-size:18px;margin-bottom:12px}.intro{text-align:center;color:#666;line-height:1.9;margin-bottom:24px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}.choice{border:2px solid #ddd;border-radius:16px;padding:18px 8px;text-align:center;background:#fff;font-size:17px;cursor:pointer}.choice.active{border-color:#222;background:#f0f2f4}label{display:block;margin:12px 4px 7px;font-weight:bold}input{width:100%;padding:15px;border:1px solid #ddd;border-radius:13px;font-size:16px}button.submit{width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:#222;color:white;font-size:17px;font-weight:bold}.success{display:none;text-align:center;background:#eef8f0;border-radius:14px;padding:15px;margin-top:16px;color:#176b2b}.note{text-align:center;color:#999;font-size:12px;margin-top:18px}</style></head>
<body><div class="wrap"><div class="card"><div class="logo">🏠</div><h1>خانه‌بازار بهاران</h1><div class="brand">املاک حیرانی</div><div class="intro">ملکتان را برای فروش یا رهن و اجاره به ما بسپارید.</div><div class="choices"><div class="choice active" onclick="selectType('فروش ملک',this)">🏠<br>فروش ملک</div><div class="choice" onclick="selectType('رهن و اجاره',this)">🔑<br>رهن و اجاره</div></div><form onsubmit="submitForm(event)"><label>نام (اختیاری)</label><input id="name" type="text" placeholder="نام شما"><label>شماره موبایل</label><input id="phone" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" required><button class="submit" type="submit">ثبت مشخصات</button></form><div id="success" class="success">درخواست شما ثبت شد. به‌زودی با شما تماس می‌گیریم.</div><div class="note">املاک حیرانی | بهاران مشهد</div></div></div><script>let type='فروش ملک';function selectType(t,el){type=t;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function submitForm(e){e.preventDefault();const phone=document.getElementById('phone').value;if(!phone.trim())return;console.log({type,name:document.getElementById('name').value,phone});document.getElementById('success').style.display='block'}</script></body></html>
